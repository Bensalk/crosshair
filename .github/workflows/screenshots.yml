name: Screenshots
# Run by hand (Actions > Screenshots > Run workflow). Builds a debug APK, runs it on an
# Android 10 emulator (phone and tablet) and pushes the screenshots to the
# screenshots-phone / screenshots-tablet branches, to copy into docs/screenshots/.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_4
          - device: tablet
            profile: pixel_c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with: { gradle-version: 8.7 }
      - name: Build debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd CrosshairOverlay && gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/screenshots.sh shots
      - name: Save screenshots to the 'screenshots-<device>' branch
        if: always()
        run: |
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || { echo "No screenshots taken"; exit 1; }
          cd shots
          git init -q && git checkout -q -b screenshots-${{ matrix.device }}
          git add *.png && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Emulator screenshots [skip ci]"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-${{ matrix.device }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crosshair-screenshots-${{ matrix.device }}
          path: shots/
